[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "zisi"

[[edge_functions]]
  path = "/deepseek-chat"
  function = "deepseek-chat"

[[edge_functions]]
  path = "/deepseek-taxonomy"
  function = "deepseek-taxonomy"

[[redirects]]
  from = "/api/extract-text"
  to = "/.netlify/functions/extract-text"
  status = 200

[[redirects]]
  from = "/api/deepseek/chat"
  to = "/deepseek-chat"
  status = 200

[[redirects]]
  from = "/api/deepseek/taxonomy"
  to = "/deepseek-taxonomy"
  status = 200

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/demo"
  to = "/.netlify/functions/auth-demo"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/auth/phone-code"
  to = "/.netlify/functions/auth-phone-code"
  status = 200

[[redirects]]
  from = "/api/auth/phone-login"
  to = "/.netlify/functions/auth-phone-login"
  status = 200

[[redirects]]
  from = "/api/auth/wechat/start"
  to = "/.netlify/functions/auth-wechat-start"
  status = 200

[[redirects]]
  from = "/api/auth/wechat/callback"
  to = "/.netlify/functions/auth-wechat-callback"
  status = 200
